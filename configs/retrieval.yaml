hybrid:
  stage1_top_k: 200
  text_stage1_top_k: 100
  rerank_pool_size: 300
  default_top_k: 20
  max_top_k: 200
  max_gap_seconds: 180.0

weights:
  visual: 0.55
  caption: 0.20
  ocr: 0.10
  objects: 0.10
  temporal: 0.05

dedupe:
  same_shot: true

text_index:
  path: data/indexes/retrieval_text_index.json
  default_top_k: 20
  max_top_k: 200

query_expansion:
  enabled: true
  max_paraphrases: 2
  original_weight: 1.0
  paraphrase_weight: 0.6
  max_expansion_contribution: 1.0
  max_query_chars: 512
  hard_paraphrase_limit: 8
  model_name: Qwen/Qwen3.5-2B
  model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  timeout_seconds: 120.0
  max_new_tokens: 384
  dtype: auto
  quantization: 4bit

online:
  # Canonical KIS/AVS route: selected-keyframe RRF -> dense rescue -> CSES.
  coarse_to_dense_enabled: true
  dense_enabled: true
  # Legacy corpora without the new dense bundle stay usable, but the response
  # trace must say selected_only_fallback instead of pretending dense ran.
  dense_missing_behavior: fallback_sparse
  coarse_top_n: 50
  dense_global_top_k: 300
  dense_rescue_clips: 10
  max_total_clips: 60
  dense_frames_per_clip: 12
  rrf_k: 60
  modality_hint_boost: 1.5
  similarity_threshold: 0.92
  temporal_window_seconds: 2.0
  max_event_gap_seconds: 180.0
  rrf_enabled: true
  cses_enabled: true
  deterministic_rerank_enabled: true
  debug_enabled: false
  # Context scoring is metadata-only and runs after CSES, before final Top-K.
  # It activates only when the matching ONLINE_*_CONTEXT_ENABLED artifact is loaded.
  neighbor_scoring_enabled: true
  segment_scoring_enabled: true
  max_neighbors_each_side: 2
  segment_context_candidate_limit: 12
  segment_context_top_k: 3
  context_max_bonus: 0.08
  rerank_coarse_rrf_weight: 0.14
  rerank_dense_visual_weight: 0.39
  rerank_caption_weight: 0.11
  rerank_ocr_weight: 0.10
  rerank_objects_weight: 0.07
  rerank_cses_gain_weight: 0.04
  rerank_temporal_consistency_weight: 0.03
  rerank_modality_alignment_weight: 0.02
  rerank_neighbor_support_weight: 0.05
  rerank_segment_support_weight: 0.05

trake:
  # BGE-M3 is independently opt-in for TRAKE; QA flags never enable it here.
  bge_dense_enabled: false
  bge_dense_top_k: 300
  bge_reranker_enabled: false
  bge_reranker_top_k: 150
  retrieval_fusion: rrf
  rrf_k: 60
  hybrid_rrf_weight: 1.0
  bge_rrf_weight: 1.0
  bge_required: false
  event_top_k: 300
  top_videos: 30
  max_candidates_per_event_per_video: 20
  max_candidates_per_shot: 2
  score_normalization: rank
  context_weight: 0.10
  coverage_weight: 0.45
  event_support_weight: 0.45
  minimum_per_event_support: 0.05
  minimum_sequence_coverage: 1.0
  minimum_semantic_support: 0.15
  minimum_visual_support: 0.15
  minimum_dense_support: 0.55
  complete_event_required: true
  stage_deadline_seconds: 180
  alignment_method: beam
  beam_width: 200
  k_best_paths_per_video: 20
  gap_penalty: log
  gap_lambda: 0.02
  refinement_enabled: true
  refinement_top_paths: 20
  window_before_frames: 60
  window_after_frames: 60
  dense_stride_frames: 1
  local_hypotheses_per_event: 3
  max_answers: 100
  ranking_cutoffs: [1, 5, 20, 50, 100]
